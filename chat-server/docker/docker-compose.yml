version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_server_container
    restart: always
    command: >
      --default-authentication-plugin=mysql_native_password
      --plugin-load-add=mysql_native_password.so
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: server_db
      MYSQL_USER: server
      MYSQL_PASSWORD: server
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data: