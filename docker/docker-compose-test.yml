version: '3.8'

services:
  mysql1:
    image: mysql:8.0
    container_name: mysql_server_1
    restart: always
    command: >
      --default-authentication-plugin=mysql_native_password
      --plugin-load-add=mysql_native_password.so
      --auto_increment_increment=2
      --auto_increment_offset=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: server_db
      MYSQL_USER: server
      MYSQL_PASSWORD: server
    ports:
      - "3309:3306"
    volumes:
      - mysql_data_1:/var/lib/mysql
      - ../chat-server/server-infrastructure/src/main/resources/mysql-server-db-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql2:
    image: mysql:8.0
    container_name: mysql_server_2
    restart: always
    command: >
      --default-authentication-plugin=mysql_native_password
      --plugin-load-add=mysql_native_password.so
      --auto_increment_increment=2
      --auto_increment_offset=2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: server_db
      MYSQL_USER: server
      MYSQL_PASSWORD: server
    ports:
      - "3310:3306"
    volumes:
      - mysql_data_2:/var/lib/mysql
      - ../chat-server/server-infrastructure/src/main/resources/mysql-server-db-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  vosk-server:
    build:
      context: ./vosk
      dockerfile: Dockerfile
    container_name: chat-app-vosk-server
    ports:
      - "2700:2700"
    restart: unless-stopped
    volumes:
      - ./vosk-model/model:/opt/vosk-model
    depends_on:
      mysql1:
        condition: service_healthy
      mysql2:
        condition: service_healthy

volumes:
  mysql_data_1:
  mysql_data_2:
