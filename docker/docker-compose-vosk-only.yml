services:
  vosk-server:
    build:
      context: ./vosk
      dockerfile: Dockerfile
    container_name: chat-vosk-server
    ports:
      - "2700:2700"
    volumes:
      - ./vosk-model/model:/opt/vosk-model
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/2700' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s